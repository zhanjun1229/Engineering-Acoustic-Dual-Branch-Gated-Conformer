[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-conformer-gate"
version = "0.1.2"
description = "Supervised Acoustic156 / IAPD26 dual-Conformer with dynamic gating"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["ruff==0.12.0", "pytest==8.4.2", "build==1.5.0"]

[project.scripts]
conformer-train = "dual_conformer_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tmp", ".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
